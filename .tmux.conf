### TMUX Config ###

## Set the default TERM/SHELL
set -g default-terminal xterm-256color
set -g default-shell /bin/zsh
set -g default-command 'zsh'

## Update the TERM variable of terminal emulator when creating a new session or attaching a existing session
set-option -g update-environment "DISPLAY \
                                  SSH \
                                  SSH_AGENT_PID \
                                  WINDOWID \
                                  XAUTHORITY \
                                  SSH_AUTH_SOCK \
                                  SSH_CONNECTION \
                                  TERM"

# force a reload of the config file
unbind r
bind r source-file ~/.tmux.conf

# user options
set-option -g history-limit 5000
set -g mouse on

# ventanas y paneles numerados desde 1, sin huecos al cerrar
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# título de la terminal = comando activo
set -g set-titles on
set-option -g set-titles-string '#{pane_current_command}'

set -g aggressive-resize on

bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

bind -n M-H resize-pane -L 2
bind -n M-L resize-pane -R 2
bind -n M-K resize-pane -U 2
bind -n M-J resize-pane -D 2

# plugin list
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Nybkox/tmux-kanagawa'

# theme options
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-ignore-window-colors true
set -g @kanagawa-show-powerline true
set -g @kanagawa-plugins "cpu-usage ram-usage"
set -g @kanagawa-show-flags true
set -g @kanagawa-show-left-icon window 
set -g @kanagawa-ram-usage-label ""
set -g @kanagawa-cpu-usage-label ""

# En un equipo nuevo, instala tpm y los plugins la primera vez que arranca tmux
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'

